<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Permission to query is not approval to share</title>
  <desc id="desc">Two separate controls surround dashboard analysis: approved sources and definitions before the query; verified results and approved audience before sharing.</desc>
  <rect width="1600" height="900" fill="#F3F6F9"/>
  <path d="M0 0H1600V20H0Z" fill="#004775"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="80" y="110" font-size="28" letter-spacing="4" fill="#004775">ITECS AI / DASHBOARD GOVERNANCE</text>
    <text x="80" y="215" font-size="70" font-weight="bold" fill="#0A1622">Permission to query.</text>
    <text x="80" y="305" font-size="70" font-weight="bold" fill="#004775">Approval to share.</text>
    <path d="M80 390H725L765 430V700H80Z" fill="#FFFFFF" stroke="#C5D1DB" stroke-width="3"/>
    <path d="M835 390H1480L1520 430V700H835Z" fill="#0A1622"/>
    <text x="120" y="458" font-size="26" fill="#004775" letter-spacing="3">BEFORE ANALYSIS</text>
    <text x="120" y="545" font-size="48" font-weight="bold" fill="#0A1622">Approved data</text>
    <text x="120" y="610" font-size="42" fill="#004775">+ agreed definitions</text>
    <path d="M780 535H820M805 520L820 535L805 550" fill="none" stroke="#3288B6" stroke-width="5"/>
    <text x="875" y="458" font-size="26" fill="#A9D5EC" letter-spacing="3">BEFORE PUBLICATION</text>
    <text x="875" y="545" font-size="48" font-weight="bold" fill="#FFFFFF">Verified results</text>
    <text x="875" y="610" font-size="42" fill="#A9D5EC">+ approved audience</text>
    <text x="80" y="797" font-size="36" fill="#0A1622">Human review connects the two.</text>
    <text x="80" y="856" font-size="24" fill="#526576">Illustrative pilot controls • Not a product screenshot</text>
  </g>
</svg>
