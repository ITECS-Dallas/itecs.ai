<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1A28"/>
      <stop offset="0.55" stop-color="#0A1622"/>
      <stop offset="1" stop-color="#08121C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#3288B6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3288B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#1E5A7E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1E5A7E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46C7E8"/>
      <stop offset="1" stop-color="#2C7AA6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#23425A" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <path d="M0 250 L1600 120" stroke="#3288B6" stroke-opacity="0.10" stroke-width="2"/>
  <path d="M0 880 L1600 760" stroke="#3288B6" stroke-opacity="0.08" stroke-width="2"/>

  <!-- left content -->
  <g transform="translate(120,150)">
    <text x="0" y="0" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="6" fill="#E6EEF5">ITECS</text>
    <text x="118" y="0" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="2" fill="#6F8597">· Dallas MSP since 2002</text>

    <g transform="translate(0,70)">
      <rect x="0" y="0" width="13" height="13" transform="rotate(45 6.5 6.5)" fill="#46C7E8"/>
      <text x="30" y="12" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="5" fill="#46C7E8">PRIVATE PROPOSAL</text>
    </g>

    <text x="0" y="206" font-family="Space Grotesk, Arial, sans-serif" font-size="80" font-weight="500" letter-spacing="-3" fill="#F2F7FB">Managed IT,</text>
    <text x="0" y="302" font-family="Space Grotesk, Arial, sans-serif" font-size="80" font-weight="500" letter-spacing="-3" fill="#F2F7FB">Security &amp; AI<tspan fill="#46C7E8">.</tspan></text>

    <text x="4" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="32" fill="#9FB4C4">Prepared for <tspan fill="#E6EEF5" font-weight="600">Purpose Capital</tspan></text>

    <g transform="translate(0,442)" font-family="IBM Plex Mono, monospace">
      <g>
        <rect x="0" y="0" width="300" height="84" rx="10" fill="#0F2235" stroke="#27506C" stroke-opacity="0.7"/>
        <text x="24" y="40" font-size="38" font-weight="600" fill="#46C7E8" font-family="Space Grotesk, Arial, sans-serif">7 AM–10 PM</text>
        <text x="24" y="66" font-size="14" letter-spacing="2" fill="#7E94A6">EXTENDED COVERAGE</text>
      </g>
      <g transform="translate(330,0)">
        <rect x="0" y="0" width="300" height="84" rx="10" fill="#0F2235" stroke="#27506C" stroke-opacity="0.7"/>
        <text x="24" y="40" font-size="38" font-weight="600" fill="#46C7E8" font-family="Space Grotesk, Arial, sans-serif">24/7</text>
        <text x="24" y="66" font-size="14" letter-spacing="2" fill="#7E94A6">THREAT RESPONSE</text>
      </g>
    </g>
  </g>

  <!-- right shield emblem -->
  <g transform="translate(1140,290)">
    <circle cx="160" cy="170" r="240" fill="#0E2233" stroke="#1E4660" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="160" cy="170" r="190" fill="none" stroke="#2C7AA6" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 9"/>

    <!-- shield outline -->
    <path d="M160 46 L268 96 V186 C268 254 218 292 160 314 C102 292 52 254 52 186 V96 Z"
          fill="#0C1C2A" stroke="url(#shieldStroke)" stroke-width="5" stroke-linejoin="round"/>

    <!-- layered defense bands inside shield -->
    <g stroke="#46C7E8" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <line x1="86" y1="126" x2="234" y2="126"/>
      <line x1="86" y1="166" x2="234" y2="166"/>
      <line x1="96" y1="206" x2="224" y2="206"/>
    </g>

    <!-- check mark -->
    <path d="M112 244 L146 276 L212 204" fill="none" stroke="#9FE3F5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="160" y="404" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="19" letter-spacing="4" fill="#7E94A6">DEFENSE IN DEPTH · GOVERNED AI</text>
  </g>

  <!-- footer strip -->
  <g transform="translate(120,902)">
    <text x="0" y="0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" fill="#7E94A6">Managed IT · Cybersecurity · Managed Cloud Hosting · Artificial Intelligence</text>
  </g>
</svg>
